[project]
name = "pj-calc"
version = "0.1.0"
description = "Quanto da conta PJ (Simples Nacional) pode ir para a conta PF: pró-labore líquido + lucros"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Angelo Polatto", email = "angelo.polatto@govone.digital" }]
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.scripts]
pj-calc = "pj_calc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pj_calc"]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
